<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>NOVAPEX - See How It Works</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="/novapex_ai_engine_poster.png">
  <link rel="preload" as="video" href="/novapex_ai_engine.mp4" type="video/mp4">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background-color: #01040c;
      background-image:
        radial-gradient(1100px 620px at 85% -10%, rgba(59, 130, 246, 0.16), transparent 60%),
        radial-gradient(900px 640px at -10% 40%, rgba(139, 92, 246, 0.18), transparent 62%),
        linear-gradient(160deg, #07111d 0%, #01040c 55%, #080c1b 100%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .video-frame {
      position: relative;
      aspect-ratio: 16 / 9;
      width: min(calc(100vw - 9rem), calc((100vh - 9rem) * 1.777778));
      max-height: calc(100vh - 9rem);
      overflow: hidden;
      border-radius: 1rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    video {
      width: calc(100% + 4rem);
      height: 100%;
      margin-left: -2rem;
      object-fit: cover;
      display: block;
    }
    .brand {
      position: absolute;
      left: 50%;
      bottom: 0.65rem;
      transform: translateX(-50%);
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(0.95rem, 2.6vw, 1.3rem);
      font-weight: 700;
      letter-spacing: 0.22em;
      color: #f1f5ff;
      text-shadow:
        0 0 12px rgba(139, 92, 246, 0.85),
        0 0 26px rgba(59, 130, 246, 0.5),
        0 2px 6px rgba(0, 0, 0, 0.8);
      background: rgba(2, 6, 23, 0.45);
      border: 1px solid rgba(167, 139, 250, 0.4);
      border-radius: 999px;
      padding: 0.35rem 1.15rem 0.35rem 1.45rem;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="video-frame">
    <video src="/novapex_ai_engine.mp4" poster="/novapex_ai_engine_poster.png" autoplay loop muted playsinline preload="auto" fetchpriority="high"></video>
    <div class="brand">novapex.ai</div>
  </div>
  <script>
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
  </script>
</body>
</html>
