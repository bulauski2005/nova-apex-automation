<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>NOVAPEX - See How It Works</title>
  <link rel="preload" as="image" href="/novapex_ai_engine_poster.png">
  <link rel="preload" as="video" href="/novapex_ai_engine.mp4" type="video/mp4">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #000000 url('/demo-bg-wallpaper.jpg') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .video-frame {
      position: relative;
      aspect-ratio: 16 / 9;
      width: min(calc(100vw - 2rem), calc((100vh - 2rem) * 1.777778));
      max-height: calc(100vh - 2rem);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 1rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      background: linear-gradient(135deg, #1e1b4b, #4c1d95 55%, #312e81);
    }
    .video-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 1rem;
      background: linear-gradient(
        135deg,
        #1e3a8a 0%,
        #31207a 45%,
        #4c1d95 100%
      );
      mix-blend-mode: multiply;
      opacity: 0.5;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="video-frame">
    <video src="/novapex_ai_engine.mp4" poster="/novapex_ai_engine_poster.png" autoplay loop muted playsinline preload="auto" fetchpriority="high"></video>
  </div>
  <script>
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
  </script>
</body>
</html>
