<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>NOVAPEX - See How It Works</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background-color: #01040c;
      background-image:
        radial-gradient(1100px 620px at 85% -10%, rgba(59, 130, 246, 0.16), transparent 60%),
        radial-gradient(900px 640px at -10% 40%, rgba(139, 92, 246, 0.18), transparent 62%),
        linear-gradient(160deg, #07111d 0%, #01040c 55%, #080c1b 100%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: #e2e8f0;
    }
    .wordmark {
      text-align: center;
      user-select: none;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #a78bfa;
      margin-bottom: 1.5rem;
    }
    .eyebrow::before,
    .eyebrow::after {
      content: '';
      width: 3rem;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(139, 92, 246, 0.6));
    }
    .eyebrow::after {
      background: linear-gradient(to left, transparent, rgba(139, 92, 246, 0.6));
    }
    h1 {
      font-size: clamp(3.5rem, 12vw, 9rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.02;
      background: linear-gradient(115deg, #c4b5fd 0%, #a78bfa 35%, #60a5fa 70%, #93c5fd 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      filter: drop-shadow(0 6px 30px rgba(139, 92, 246, 0.35)) drop-shadow(0 0 18px rgba(59, 130, 246, 0.22));
    }
    .rule {
      width: min(26rem, 70vw);
      height: 1px;
      margin: 2.25rem auto;
      background: linear-gradient(
        to right,
        transparent,
        rgba(139, 92, 246, 0.55) 20%,
        rgba(59, 130, 246, 0.55) 80%,
        transparent
      );
    }
    .subtitle {
      font-size: clamp(0.9rem, 2.4vw, 1.15rem);
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .subtitle strong {
      font-weight: 700;
      color: #e0e7ff;
    }
    .hint {
      margin-top: 3rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="wordmark">
    <span class="eyebrow">AI Engine</span>
    <h1>NOVAPEX</h1>
    <div class="rule"></div>
    <p class="subtitle">See how it works</p>
    <p class="subtitle" style="margin-top:0.6rem;font-size:clamp(0.78rem,2vw,0.95rem);letter-spacing:0.18em;">Reimagining <strong>Dental Practice</strong> Automation</p>
    <p class="hint">press ESC to close</p>
  </div>
  <script>
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
  </script>
</body>
</html>
