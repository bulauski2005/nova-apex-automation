<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>NOVAPEX - See How It Works</title>
  <link rel="preload" as="image" href="/novapex_ai_engine_poster.png">
  <link rel="preload" as="video" href="/novapex_ai_engine.mp4" type="video/mp4">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background-color: #01040c;
      background-image:
        radial-gradient(1100px 620px at 85% -10%, rgba(59, 130, 246, 0.16), transparent 60%),
        radial-gradient(900px 640px at -10% 40%, rgba(139, 92, 246, 0.18), transparent 62%),
        linear-gradient(160deg, #07111d 0%, #01040c 55%, #080c1b 100%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .video-frame {
      aspect-ratio: 16 / 9;
      width: min(calc(100vw - 2rem), calc((100vh - 2rem) * 1.777778));
      max-height: calc(100vh - 2rem);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 1rem;
      mix-blend-mode: screen;
    }
  </style>
</head>
<body>
  <div class="video-frame">
    <video src="/novapex_ai_engine.mp4" poster="/novapex_ai_engine_poster.png" autoplay loop muted playsinline preload="auto" fetchpriority="high"></video>
  </div>
  <script>
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
  </script>
</body>
</html>
