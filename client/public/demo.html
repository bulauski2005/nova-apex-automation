<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>NOVAPEX - See How It Works</title>
  <link rel="preload" as="image" href="/novapex_ai_engine_poster.png">
  <link rel="preload" as="video" href="/novapex_ai_engine.mp4" type="video/mp4">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background-color: #01040c;
      background-image:
        linear-gradient(to right, rgba(95, 225, 238, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(95, 225, 238, 0.04) 1px, transparent 1px),
        radial-gradient(600px 600px at 75% 100%, rgba(95, 225, 238, 0.1), transparent 70%),
        radial-gradient(480px 480px at 0% 35%, rgba(139, 92, 246, 0.25), transparent 65%),
        radial-gradient(600px 600px at 100% -5%, rgba(59, 130, 246, 0.2), transparent 65%),
        linear-gradient(to bottom right, #07111d 0%, #01040c 50%, #080c1b 100%);
      background-size: 56px 56px, 56px 56px, auto, auto, auto, auto;
      background-repeat: repeat, repeat, no-repeat, no-repeat, no-repeat, no-repeat;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .video-frame {
      aspect-ratio: 16 / 9;
      width: min(calc(100vw - 2rem), calc((100vh - 2rem) * 1.777778));
      max-height: calc(100vh - 2rem);
      overflow: hidden;
      border-radius: 1rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      background: transparent;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      border-radius: inherit;
    }
  </style>
</head>
<body>
  <div class="video-frame">
    <video src="/novapex_ai_engine.mp4" poster="/novapex_ai_engine_poster.png" autoplay loop muted playsinline preload="auto" fetchpriority="high"></video>
  </div>
  <script>
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
  </script>
</body>
</html>
