<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>NOVAPEX - See How It Works</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: linear-gradient(135deg, #001a4d 0%, #0d2d5e 50%, #003366 100%); 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle at 20% 20%, rgba(3, 225, 234, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(3, 225, 234, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(0, 255, 255, 0.04) 0%, transparent 70%);
      pointer-events: none;
    }
    .video-container { 
      max-width: 90vw; 
      max-height: 90vh; 
      position: relative;
      z-index: 1;
    }
    video { 
      width: 100%; 
      height: auto; 
      border-radius: 12px; 
      box-shadow: 0 20px 60px rgba(0, 26, 77, 0.6), 0 0 40px rgba(3, 225, 234, 0.15);
      border: 1px solid rgba(3, 225, 234, 0.2);
    }
    .close-hint { color: rgba(3, 225, 234, 0.7); text-align: center; margin-top: 16px; font-family: system-ui; font-size: 14px; }
  </style>
</head>
<body>
  <div class='video-container'>
    <video src='/novapex_ai_engine_light.mp4' autoplay loop muted playsinline controls></video>
    <p class='close-hint'>Press ESC or close tab to return</p>
  </div>
  <script>
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
  </script>
</body>
</html>
