<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novapex Automation - Demo Engine</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .demo-container {
      min-height: 100vh;
      width: 100%;
      background-image: url('new_background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-layout-wrapper {
      width: 75%;
      max-width: 1250px;
      aspect-ratio: 16 / 9;
      position: relative;
    }

    .video-layout-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <main class="demo-container">
    <div class="video-layout-wrapper">
      <video autoplay loop muted playsinline>
        <source src="transparent_engine.webm" type="video/webm">
        Your browser does not support transparent video playback.
      </video>
    </div>
  </main>
</body>
</html>
